  <style type="text/css">
    html,
    button {
      font-family: "Roboto Slab", serif !important;
    }
  </style>
  <style type="text/css">
    html ::-webkit-scrollbar {
      -webkit-appearance: none;
      width: 7px;
      height: 7px;
      min-height: 7px;
      z-index: 5;
    }

    html ::-webkit-scrollbar-thumb {
      border-radius: 4px;
      min-width: 50px;
      height: 7px;
      min-height: 7px;
      background-color: #7ac0e3;
      -webkit-box-shadow: 0 0 1px hsla(0, 0%, 100%, 0.5);
      z-index: 5;
    }

    input[type="color"]::-moz-color-swatch {
      border: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
      border-radius: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
    }

    body {
      padding: 0;
      margin: 0;
      background: linear-gradient(135deg,
          rgb(214, 228, 255),
          rgb(160, 196, 255));
      background-repeat: no-repeat;
      background-size: 100% 100%;
      height: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body #app {
      color: var(--main-color);
    }

    body #app[data-mode-theme="light"] {
      --main-bg-color: #fff;
      --main-bg-color-transparent: hsla(0, 0%, 100%, 0.75);
      --standout-bg-color: #ededff;
      --standout-alt-bg-color: #ffedf9;
      --box-shadow-color: rgba(0, 0, 0, 0.2);
      --main-color: #2f2f6a;
      --main-color-transparent: rgba(47, 47, 106, 0.75);
      --border-color: rgba(73, 80, 87, 0.3);
      --border-color-solid: #aab3bd;
      --border-color-transparent: rgba(7, 80, 87, 0.1);
      --border-color-alt: #adadfd;
      --selection-color: #e7f8ff;
      --selection-color-transparent: rgba(231, 248, 255, 0.75);
      --selection-color-alt: #b3d6e5;
      --icon-color: #5d8fc1;
      --cell-selection-color: hsla(0, 0%, 100%, 0.75);
      --cell-sticky-color: #deeff7;
      --bg-color-disabled: rgb(0 0 0/5%);
      --border-color-disabled: rgba(0, 0, 0, 0.1);
      --link-color: #247cd5;
    }

    body #app[data-mode-theme="dark"] input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
